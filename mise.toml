[tools]
python = "3.14"
uv = "0.13"

[tasks.test]
description = "Render the template with defaults and run the generated project's checks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
out="$(mktemp -d)/zetra-agent"
uvx copier copy --defaults --overwrite \
  -d author_name="Test Author" -d author_email="test@example.com" \
  . "$out"
cd "$out"
git init -q && git add -A
mise trust -q && mise install -q
uv sync -q
uv run pre-commit run --all-files
uv run pytest -q
echo "Rendered and verified: $out"
'''
