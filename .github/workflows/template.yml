# This repository is what `zetra-agents init` renders at the zetra commit the root
# pyproject pins, with the agent named my-agent. This check re-renders it and diffs, so
# the template cannot drift from the tooling; the rendered ci.yml checks the rest.
name: Template
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rerender:
    # Only the template repository is expected to equal a fresh render. A repository
    # created from it stops matching as soon as its agent is renamed or changed, so
    # the check does not run there; delete this file in such a repository.
    if: github.repository == 'X-McKay/zetra-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.13.1"
          python-version: "3.12.14"
      - name: Re-render from the pinned zetra commit and diff
        run: |
          rev=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['uv']['sources']['agent-runtime']['rev'])")
          uvx --from "git+https://github.com/X-McKay/zetra@$rev#subdirectory=platform/agent-tools" \
            zetra-agents init "$RUNNER_TEMP/render" --name my-agent \
            --owner 4785437+X-McKay@users.noreply.github.com \
            --description "Starter agent rendered by zetra-agents init; rename it with zetra-agents rename" \
            --no-lock --no-git
          diff -r --exclude=.git --exclude=uv.lock --exclude=.venv --exclude=template.yml "$RUNNER_TEMP/render" .
          echo "template matches zetra-agents init at $rev"
