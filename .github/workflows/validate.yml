name: Validate canonical template
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.12.14'
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: python scripts/render.py "$RUNNER_TEMP/rendered-agent" --name rendered-agent
      - name: Validate rendered application against its pinned SDK
        working-directory: ${{ runner.temp }}/rendered-agent
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked pytest
          uv run --locked zetra check .
          uv run --locked zetra eval . --mode fixture
          uv build --wheel
          uv run --locked python tests/packaging/check_wheel.py dist/*.whl
